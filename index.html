<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Residence Typo Final</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#111;
  font-family:'Inter', sans-serif;
  font-weight:500;
}

.wrap{
  height:400vh;
}

/* =========================
DESKTOP (как у тебя)
========================= */

.block{
  position:sticky;
  top:0;
  height:100vh;
  display:grid;
  grid-template-columns:1fr 1fr;
  overflow:hidden;

  opacity:0.4;
  transform:scale(1.02);
  transition:all 0.7s ease;
}

.block.active{
  opacity:1;
  transform:scale(1);
}

.orange{ background:#ff4d1a; }
.green{ background:#7CFF2E; }
.purple{ background:#6A4CFF; }

.card{
  width:100%;
  height:100%;
  display:grid;
  grid-template-columns:1fr 1fr;
}

.symbol{
  display:flex;
  align-items:center;
  justify-content:center;
}

.symbol img{
  width:min(70vh,680px);
  height:min(70vh,680px);
  object-fit:contain;
}

.text{
  background:#1a1a1a;
  color:#fff;
  display:flex;
  flex-direction:column;
  justify-content:flex-start;
  padding:70px 80px;
}

h2{
  font-size:clamp(52px,4vw,72px);
  margin-bottom:24px;
}

p{
  font-size:clamp(22px,1.6vw,30px);
  line-height:1.5;
  opacity:0.92;
}

/* =========================
MOBILE (RESIDENCE STYLE FIX)
========================= */

@media (max-width:768px){

.wrap{
  height:auto;
}

/* сцена */
.block{
  position:sticky;
  top:0;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;

  opacity:0.4;
  transform:scale(1.03);
  transition:all 0.7s ease;
}

.block.active{
  opacity:1;
  transform:scale(1);
}

/* 🔥 КВАДРАТ КАК НА RESIDENCE */
.card{
  width:90vw;
  aspect-ratio:1 / 1;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* цвет карточки */
.orange{ background:#ff4d1a; }
.green{ background:#7CFF2E; }
.purple{ background:#6A4CFF; }

/* КАРТИНКА СВЕРХУ */
.symbol{
  flex:0 0 55%;
  display:flex;
  align-items:center;
  justify-content:center;
}

.symbol img{
  width:60%;
  height:auto;
}

/* ТЕКСТ СНИЗУ */
.text{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:flex-start;
  padding:16px;
}

h2{
  font-size:18px;
  margin-bottom:8px;
}

p{
  font-size:13px;
  line-height:1.4;
}

}

</style>
</head>

<body>

<div class="wrap">

<!-- 1 -->
<section class="block">
  <div class="card orange">

    <div class="symbol">
      <img src="images/tea.svg">
    </div>

    <div class="text">
      <h2>Пьем чай</h2>
      <p>Пауза — настройка слуха. Завариваем, разливаем, молчим.</p>
    </div>

  </div>
</section>

<!-- 2 -->
<section class="block">
  <div class="card green">

    <div class="symbol">
      <img src="images/wood.svg">
    </div>

    <div class="text">
      <h2>Делаем деревяшки</h2>
      <p>Чайные принадлежности и красота из дерева.</p>
    </div>

  </div>
</section>

<!-- 3 -->
<section class="block">
  <div class="card purple">

    <div class="symbol">
      <img src="images/instruments.svg">
    </div>

    <div class="text">
      <h2>Инструменты</h2>
      <p>Гравитон, кахон, монохорд.</p>
    </div>

  </div>
</section>

<!-- 4 -->
<section class="block">
  <div class="card orange">

    <div class="symbol">
      <img src="images/music.svg">
    </div>

    <div class="text">
      <h2>Музыка</h2>
      <p>Без нот. Без правил.</p>
    </div>

  </div>
</section>

</div>

<script>
const blocks = document.querySelectorAll('.block');

const observer = new IntersectionObserver((entries)=>{
  entries.forEach(entry=>{
    if(entry.isIntersecting){
      entry.target.classList.add('active');
    } else {
      entry.target.classList.remove('active');
    }
  });
},{ threshold:0.6 });

blocks.forEach(b=>observer.observe(b));
</script>

</body>
</html>
